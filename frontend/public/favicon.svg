<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#grad1)" />
  
  <!-- Document Shape -->
  <path d="M160 120 h130 l90 90 v182 a20 20 0 0 1 -20 20 h-200 a20 20 0 0 1 -20 -20 v-252 a20 20 0 0 1 20 -20 z" fill="#f8fafc" opacity="0.9" />
  <path d="M290 120 v90 h90" fill="#cbd5e1" opacity="0.8" />
  
  <!-- AI Sparkle/Chip Element -->
  <g transform="translate(256, 280) scale(0.6)" fill="#4f46e5" filter="url(#glow)">
    <path d="M0 -90 L20 -20 L90 0 L20 20 L0 90 L-20 20 L-90 0 L-20 -20 Z" />
    <circle cx="0" cy="0" r="15" fill="#818cf8" />
  </g>
</svg>
